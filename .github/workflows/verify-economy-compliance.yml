name: Verify Economy Compliance Integration

on:
  push:
    branches:
      - feat/economy-compliance-agent-2026-09-22
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify economy compliance policy
        run: npm run verify:economy-compliance

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

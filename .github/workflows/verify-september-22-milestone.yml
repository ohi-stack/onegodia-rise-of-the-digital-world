name: Verify September 22 milestone integration

on:
  push:
    branches:
      - main
      - milestone/2026-09-22-browser-3d
  pull_request:
    branches:
      - main

jobs:
  verify-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify milestone integration
        run: node scripts/verify-september-22-milestone.mjs
      - name: Type-check
        run: npm run lint
      - name: Build production bundle
        run: npm run build

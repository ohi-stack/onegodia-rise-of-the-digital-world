name: OneGodian Games Plugin CI

on:
  pull_request:
    paths:
      - "wordpress/onegodian-games/**"
      - ".github/workflows/onegodian-games.yml"
  push:
    paths:
      - "wordpress/onegodian-games/**"
      - ".github/workflows/onegodian-games.yml"

permissions:
  contents: read

jobs:
  plugin-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: PHP syntax
        run: php -l wordpress/onegodian-games/onegodian-games.php
      - name: WordPress shortcode smoke checks
        run: php wordpress/onegodian-games/tests/verify-plugin.php
      - name: Platformer gameplay checks
        run: node wordpress/onegodian-games/tests/verify-platformer.mjs
      - name: Build review ZIP
        run: |
          cd wordpress
          zip -r onegodian-games.zip onegodian-games -x "onegodian-games/tests/*"
          unzip -l onegodian-games.zip
      - name: Upload candidate plugin
        uses: actions/upload-artifact@v4
        with:
          name: onegodian-games-plugin-candidate
          path: wordpress/onegodian-games.zip
          if-no-files-found: error
